
name: Build AI Video Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          unzip AI-Video-Studio-Android-Source.zip -d project
          gradle -p project/AI-Video-Studio assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Video-Studio-APK
          path: project/AI-Video-Studio/app/build/outputs/apk/debug/app-debug.apk
